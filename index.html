<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b45">
  <meta name="description" content="QR-based ID verification system">
  <title>ID Verification System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand-mark">ID</div>
      <div>
        <p class="eyebrow">OFFICIAL VERIFICATION</p>
        <h1>ID Verification</h1>
        <p class="subtitle">Scan a QR code or enter a control number to verify an ID.</p>
      </div>
    </header>

    <section class="card actions-card">
      <button id="scanBtn" class="primary-btn" type="button">📷 Scan QR Code</button>
      <div class="divider"><span>OR</span></div>
      <form id="searchForm" class="search-form">
        <label for="controlInput">Control Number</label>
        <div class="search-row">
          <input id="controlInput" name="control" inputmode="numeric" autocomplete="off" placeholder="e.g. 2026004" required>
          <button class="search-btn" type="submit">Search</button>
        </div>
      </form>
    </section>

    <section id="scannerCard" class="card scanner-card hidden">
      <div id="reader"></div>
      <button id="closeScanner" class="secondary-btn" type="button">Close Scanner</button>
      <p id="scannerMessage" class="muted">Allow camera access when your browser asks.</p>
    </section>

    <section id="resultCard" class="card result-card hidden" aria-live="polite">
      <div id="statusBadge" class="status-badge"></div>
      <h2 id="resultTitle">Verification Result</h2>
      <p id="resultMessage" class="muted"></p>
      <dl id="details" class="details"></dl>
      <button id="verifyAnother" class="secondary-btn" type="button">Verify Another ID</button>
    </section>

    <p class="footer-note">Verification results are retrieved from the official verification database.</p>
  </main>

  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
